---
- name: Deploy LAMP stack to Azure VM
  hosts: web
  become: true

  vars_files:
    - vars/secrets.yml

  vars:
    repo_url: "https://github.com/Refloks/azure-lamp-stack.git"
    app_dir: "/opt/lamp_docker"

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true

    - name: Install prerequisite packages
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present

    - name: Add Docker's official GPG key
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Add Docker apt repository
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
        state: present

    - name: Install Docker Engine and Compose plugin
      apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Add azureadmin to docker group
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true

    - name: Clone or update the application repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: master
        update: true

    - name: Generate .env file with secrets
      copy:
        dest: "{{ app_dir }}/.env"
        content: |
          MYSQL_ROOT_PASSWORD={{ mysql_root_password }}
          MYSQL_DATABASE={{ mysql_database }}
          MYSQL_USER={{ mysql_user }}
          MYSQL_PASSWORD={{ mysql_password }}
        mode: '0600'

    - name: Start LAMP stack with Docker Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present

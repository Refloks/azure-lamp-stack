---
- name: Configure monitoring stack
  hosts: web
  become: true

  tasks:
    - name: Install monitoring packages
      ansible.builtin.apt:
        name:
          - prometheus
          - prometheus-node-exporter
          - gpg
          - wget
        state: present
        update_cache: true

    - name: Ensure node_exporter is enabled and running
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

    - name: Ensure Prometheus is enabled and running
      ansible.builtin.systemd:
        name: prometheus
        enabled: true
        state: started

    - name: Create Grafana keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Grafana repository key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Update apt cache after adding Grafana repository
      ansible.builtin.apt:
        update_cache: true

    - name: Install Grafana
      ansible.builtin.apt:
        name: grafana
        state: present

    - name: Enable and start Grafana
      ansible.builtin.systemd:
        name: grafana-server
        enabled: true
        state: started

    - name: Create Grafana datasource provisioning directory
      ansible.builtin.file:
        path: /etc/grafana/provisioning/datasources
        state: directory
        owner: root
        group: grafana
        mode: "0755"

    - name: Configure Prometheus datasource in Grafana
      ansible.builtin.copy:
        dest: /etc/grafana/provisioning/datasources/prometheus.yml
        owner: root
        group: grafana
        mode: "0644"
        content: |
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true

    - name: Restart Grafana after datasource configuration
      ansible.builtin.systemd:
        name: grafana-server
        state: restarted
